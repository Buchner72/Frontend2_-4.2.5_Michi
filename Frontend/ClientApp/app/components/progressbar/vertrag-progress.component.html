<div *ngIf="percent != 0" style="margin-top: 10px; margin-bottom: 10px;">
    <div class="row">
        <div class="col-md-12">
            <progressbar class="progress" [max]="100" [value]="percent">
                <span style="color:white; white-space:nowrap;">{{percent}} %</span>
            </progressbar>
        </div>
    </div>
</div>
